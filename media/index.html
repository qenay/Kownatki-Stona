<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plaża Kownatki — nasze social media</title>
  <meta name="description" content="Ośrodek Plaża Kownatki — wszystkie nasze kanały w jednym miejscu: Facebook, Instagram, TikTok i strona internetowa." />
  <link rel="canonical" href="https://www.plazakownatki.pl/media" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />

  <!-- Open Graph -->
  <meta property="og:title" content="Plaża Kownatki — nasze social media" />
  <meta property="og:description" content="Wszystkie nasze kanały w jednym miejscu." />
  <meta property="og:image" content="https://www.plazakownatki.pl/gallery-zachod.jpg" />
  <meta property="og:url" content="https://www.plazakownatki.pl/media" />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=Marcellus&display=swap" rel="stylesheet" />

  <style>
    :root {
      --navy:    #0e2444;
      --gold:    #bc9675;
      --gold-lt: #d4b08f;
      --off-white: #ececec;
      --white:   #ffffff;
      --text:    #1a1a1a;
      --radius:  16px;
      --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      font-family: 'DM Sans', sans-serif;
      color: var(--white);
      background: var(--navy);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Tło — zdjęcie zachodu słońca z przyciemnieniem */
    .bg {
      position: fixed;
      inset: 0;
      background: url('../gallery-zachod.jpg') center / cover no-repeat;
      z-index: 0;
    }
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg,
        rgba(14, 36, 68, 0.78) 0%,
        rgba(14, 36, 68, 0.86) 45%,
        rgba(14, 36, 68, 0.94) 100%);
    }

    .wrap {
      position: relative;
      z-index: 1;
      flex: 1;
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      padding: 56px 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Logo / żaglówka */
    .logo {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(212, 176, 143, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
      animation: fadeUp 0.7s ease both;
    }
    .logo img { width: 64px; height: 64px; }

    h1 {
      font-family: 'Marcellus', serif;
      font-size: 30px;
      font-weight: 400;
      letter-spacing: 0.01em;
      margin-top: 22px;
      animation: fadeUp 0.7s 0.05s ease both;
    }

    .tagline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      color: var(--gold-lt);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      animation: fadeUp 0.7s 0.1s ease both;
    }
    .tagline::before, .tagline::after {
      content: '';
      width: 26px;
      height: 1px;
      background: rgba(212, 176, 143, 0.5);
    }

    .intro {
      margin-top: 18px;
      max-width: 340px;
      font-size: 14.5px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.75);
      font-weight: 300;
      animation: fadeUp 0.7s 0.15s ease both;
    }

    /* Linki */
    .links {
      width: 100%;
      margin-top: 36px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 16px 20px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--white);
      text-decoration: none;
      backdrop-filter: blur(10px);
      transition: transform var(--transition), background var(--transition), border-color var(--transition);
      animation: fadeUp 0.6s ease both;
    }
    .link:nth-child(1) { animation-delay: 0.22s; }
    .link:nth-child(2) { animation-delay: 0.30s; }
    .link:nth-child(3) { animation-delay: 0.38s; }
    .link:nth-child(4) { animation-delay: 0.46s; }

    .link:hover {
      transform: translateY(-3px);
      background: rgba(212, 176, 143, 0.16);
      border-color: rgba(212, 176, 143, 0.55);
    }

    .link-ico {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--white);
    }
    .link-ico svg { width: 22px; height: 22px; }

    .link-body {
      flex: 1;
      text-align: left;
    }
    .link-title {
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .link-sub {
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 2px;
      font-weight: 300;
    }
    .link-arrow {
      color: var(--gold-lt);
      font-size: 18px;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity var(--transition), transform var(--transition);
    }
    .link:hover .link-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.45);
      font-weight: 300;
      letter-spacing: 0.04em;
    }
    footer a { color: var(--gold-lt); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      h1 { font-size: 26px; }
      .wrap { padding-top: 44px; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <main class="wrap">
    <div class="logo">
      <img src="../favicon.svg" alt="Plaża Kownatki" />
    </div>

    <h1>Plaża Kownatki</h1>
    <div class="tagline">Mazury</div>
    <p class="intro">Twoje miejsce nad jeziorem — noclegi, kemping, plaża i wydarzenia. Znajdź nas wszędzie:</p>

    <nav class="links">

        </span>
        <span class="link-body">
          <div class="link-title">Facebook</div>

            <path fill="url(#ig)" d="M12 2.16c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.7 3.7 0 01-1.38-.9 3.7 3.7 0 01-.9-1.38c-.16-.42-.36-1.06-.41-2.23C2.17 15.58 2.16 15.2 2.16 12s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41C8.42 2.17 8.8 2.16 12 2.16M12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63c-.79.31-1.46.72-2.12 1.38C1.36 2.67.95 3.34.63 4.14.33 4.9.13 5.78.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.06 1.27.26 2.15.56 2.91.31.79.72 1.46 1.38 2.12.66.66 1.33 1.07 2.12 1.38.76.3 1.64.5 2.91.56C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c1.27-.06 2.15-.26 2.91-.56.79-.31 1.46-.72 2.12-1.38.66-.66 1.07-1.33 1.38-2.12.3-.76.5-1.64.56-2.91.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.26-2.15-.56-2.91a5.86 5.86 0 00-1.38-2.12A5.86 5.86 0 0019.86.63c-.76-.3-1.64-.5-2.91-.56C15.67.01 15.26 0 12 0z"/>
            <path fill="url(#ig)" d="M12 5.84A6.16 6.16 0 1018.16 12 6.16 6.16 0 0012 5.84zM12 16a4 4 0 114-4 4 4 0 01-4 4z"/>
            <circle fill="url(#ig)" cx="18.41" cy="5.59" r="1.44"/>
          </svg>
        </span>
        <span class="link-body">
          <div class="link-title">Instagram</div>
          <div class="link-sub">@plazakownatki</div>
        </span>
        <span class="link-arrow">→</span>
      </a>

      <!-- TikTok -->
      <a class="link" href="https://www.tiktok.com/@plaza.kownatki" target="_blank" rel="noopener">
        <span class="link-ico">
          <svg viewBox="0 0 24 24">

            <path fill="#FE2C55" d="M16.9 5.16A3.99 3.99 0 0115.9 2.5h-1.13a4.02 4.02 0 003.66 3.93 6.55 6.55 0 01-1.53-1.27z"/>

        </span>
        <span class="link-body">
          <div class="link-title">TikTok</div>
          <div class="link-sub">@plaza.kownatki</div>
        </span>
        <span class="link-arrow">→</span>
      </a>

      <!-- Strona internetowa -->
      <a class="link" href="https://www.plazakownatki.pl" target="_blank" rel="noopener">
        <span class="link-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0e2444" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M2 12h20"/>
            <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
          </svg>
        </span>
        <span class="link-body">
          <div class="link-title">Strona internetowa</div>
          <div class="link-sub">plazakownatki.pl</div>
        </span>
        <span class="link-arrow">→</span>
      </a>
    </nav>
  </main>

  <footer>
    © <span id="year"></span> Ośrodek Plaża Kownatki ·
    <a href="https://www.plazakownatki.pl">plazakownatki.pl</a>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
